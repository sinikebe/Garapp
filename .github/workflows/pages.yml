name: GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Keep the lock through both checkout and deployment, so queued runs rebuild
# from current branch heads instead of publishing an older assembled artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish main and dev
    # workflow_run executes on the default branch. Keep Pages deployments on
    # main even when validation was triggered by a push to dev.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout publishing tools
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          path: tooling

      - name: Checkout the latest main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          path: sources/main

      - name: Checkout the latest dev
        uses: actions/checkout@v6
        with:
          ref: dev
          persist-credentials: false
          path: sources/dev

      - name: Prepare both versions
        run: |
          python3 tooling/scripts/prepare_pages.py --source sources/main --output _site --branch main
          python3 tooling/scripts/prepare_pages.py --source sources/dev --output _site/dev --branch dev

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload both versions as one site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
