name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Application and backup compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the proposed revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare the current revision
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: >-
          python3 scripts/prepare_pages.py
          --source .
          --output "$RUNNER_TEMP/garapp-check"
          --branch "$TARGET_BRANCH"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check source, documentation and offline bundle
        run: npm run check:source

      - name: Verify historical backup compatibility
        run: npm run check:backups

      - name: Keep historical backup inputs immutable
        env:
          BACKUP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/check-backup-fixtures.mjs

      - name: Verify application behavior
        run: npm test
