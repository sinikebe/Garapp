name: Cloudflare Worker assets

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: cloudflare-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check Worker static assets without publishing
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          node scripts/prepare_cloudflare.mjs --source . --output "$RUNNER_TEMP/cloudflare-check" --branch "$BRANCH" --domain example.test
          test -s "$RUNNER_TEMP/cloudflare-check/index.html"
          test -s "$RUNNER_TEMP/cloudflare-check/sw.js"
